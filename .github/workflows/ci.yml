name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          components: rustfmt
      - name: Check shell installer syntax
        run: bash -n scripts/install.sh
      - name: Check release gate scripts
        run: |
          bash -n scripts/ci/legacy-upgrade.sh
          python3 -m py_compile scripts/prepare-release-metadata.py
      - name: Check formatting
        run: cargo fmt --check
      # Prebuilt binary instead of compiling cargo-audit on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  test:
    name: Test (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: macos
            os: macos-latest
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          components: clippy
      # Branch CI only; release builds stay uncached so published binaries
      # never depend on restored build state.
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check shell installer syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh
      - name: Check PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in 'scripts/install.ps1', 'scripts/ci/legacy-upgrade.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $_" -ErrorAction Continue }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP ("codex-switch-cargo-test-{0}.log" -f [guid]::NewGuid())
          & cargo test --all 2>&1 | Tee-Object -FilePath $logPath
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) {
            $tailLines = @(Get-Content -LiteralPath $logPath -Tail 100 -Encoding utf8)
            $message = [string]::Join("`n", $tailLines)
            if ($message.Length -gt 18000) {
              $start = $message.Length - 18000
              if ([char]::IsLowSurrogate($message[$start])) { $start++ }
              $message = "[Earlier output truncated]`n" + $message.Substring($start)
            }
            $chunks = [System.Collections.Generic.List[string]]::new()
            $offset = 0
            while ($offset -lt $message.Length) {
              $length = [Math]::Min(900, $message.Length - $offset)
              if (($offset + $length) -lt $message.Length -and
                  [char]::IsHighSurrogate($message[$offset + $length - 1])) {
                $length--
              }
              $chunks.Add($message.Substring($offset, $length))
              $offset += $length
            }
            if ($chunks.Count -eq 0) { $chunks.Add('(no test output captured)') }
            for ($index = 0; $index -lt $chunks.Count; $index++) {
              $part = $index + 1
              $escaped = $chunks[$index].Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::cargo test --all failed with exit code $cargoExitCode (part $part/$($chunks.Count)): $escaped"
            }
          }
          exit $cargoExitCode
