name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          components: rustfmt
      - name: Check shell installer syntax
        run: bash -n scripts/install.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  test:
    name: Test (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: macos
            os: macos-latest
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          components: clippy
      - name: Check shell installer syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Run tests
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP ("codex-switch-cargo-test-{0}.log" -f [guid]::NewGuid())
          & cargo test --all 2>&1 | Tee-Object -FilePath $logPath
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) {
            $tailLines = @(Get-Content -LiteralPath $logPath -Tail 100 -Encoding utf8)
            $message = [string]::Join("`n", $tailLines)
            if ($message.Length -gt 18000) {
              $start = $message.Length - 18000
              if ([char]::IsLowSurrogate($message[$start])) { $start++ }
              $message = "[Earlier output truncated]`n" + $message.Substring($start)
            }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::cargo test --all failed with exit code $cargoExitCode. Last test output: $message"
          }
          exit $cargoExitCode
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build debug binary
        run: cargo build
