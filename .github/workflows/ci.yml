name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          components: rustfmt
      - name: Check shell installer syntax
        run: bash -n scripts/install.sh
      - name: Check release gate scripts
        run: |
          bash -n scripts/ci/legacy-upgrade.sh
          python3 -m py_compile \
            scripts/prepare-release-metadata.py \
            scripts/inject-release-version.py \
            scripts/test_inject_release_version.py \
            scripts/provider-live-smoke.py \
            scripts/test_provider_live_smoke.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --check
      # Prebuilt binary instead of compiling cargo-audit on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  test:
    name: Test (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: macos
            os: macos-latest
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          components: clippy
      # Branch CI only; release builds stay uncached so published binaries
      # never depend on restored build state.
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check shell installer syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh
      - name: Check PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in 'scripts/install.ps1', 'scripts/ci/legacy-upgrade.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $_" -ErrorAction Continue }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build distribution binary (Linux)
        if: runner.os == 'Linux'
        run: cargo build --locked --bin codex-switch
      - name: Run tests
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP ("codex-switch-cargo-test-{0}.log" -f [guid]::NewGuid())
          & cargo test --all --locked 2>&1 | Tee-Object -FilePath $logPath
          $cargoExitCode = $LASTEXITCODE
          if ($cargoExitCode -ne 0) {
            $tailLines = @(Get-Content -LiteralPath $logPath -Tail 100 -Encoding utf8)
            $message = [string]::Join("`n", $tailLines)
            if ($message.Length -gt 18000) {
              $start = $message.Length - 18000
              if ([char]::IsLowSurrogate($message[$start])) { $start++ }
              $message = "[Earlier output truncated]`n" + $message.Substring($start)
            }
            $chunks = [System.Collections.Generic.List[string]]::new()
            $offset = 0
            while ($offset -lt $message.Length) {
              $length = [Math]::Min(900, $message.Length - $offset)
              if (($offset + $length) -lt $message.Length -and
                  [char]::IsHighSurrogate($message[$offset + $length - 1])) {
                $length--
              }
              $chunks.Add($message.Substring($offset, $length))
              $offset += $length
            }
            if ($chunks.Count -eq 0) { $chunks.Add('(no test output captured)') }
            for ($index = 0; $index -lt $chunks.Count; $index++) {
              $part = $index + 1
              $escaped = $chunks[$index].Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::cargo test --all --locked failed with exit code $cargoExitCode (part $part/$($chunks.Count)): $escaped"
            }
          }
          exit $cargoExitCode
      - name: Download and verify official Codex engine (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CODEX_ENGINE_URL: https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-x86_64-unknown-linux-musl.tar.gz
          CODEX_ENGINE_SHA256: 86f268d81b898f3e144c5ecff2ad2fda2c5802e042d6195b72538fe0fa125057
        run: |
          archive="$RUNNER_TEMP/codex-x86_64-unknown-linux-musl.tar.gz"
          engine_dir="$RUNNER_TEMP/codex-engine"
          curl --fail --location --retry 3 --output "$archive" "$CODEX_ENGINE_URL"
          printf '%s  %s\n' "$CODEX_ENGINE_SHA256" "$archive" | sha256sum --check
          mkdir -p "$engine_dir"
          tar xzf "$archive" -C "$engine_dir"
          test -x "$engine_dir/codex-x86_64-unknown-linux-musl"
      - name: Run official Codex capability smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          codex="$RUNNER_TEMP/codex-engine/codex-x86_64-unknown-linux-musl"
          switch="$GITHUB_WORKSPACE/target/debug/codex-switch"
          python3 scripts/ci/provider-capability-smoke.py \
            --codex "$codex" \
            --switch "$switch" \
            --output "$RUNNER_TEMP/codex-smoke-native" \
            --catalog native \
            --child-model \
            --v2-lifecycle \
            --resume
          python3 scripts/ci/provider-capability-smoke.py \
            --codex "$codex" \
            --switch "$switch" \
            --output "$RUNNER_TEMP/codex-smoke-generic" \
            --catalog generic \
            --child-model \
            --resume
