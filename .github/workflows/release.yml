name: Release

on:
  push:
    tags:
      - "v*"
      - "dev"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      is_dev: ${{ steps.parse.outputs.is_dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse tag
        id: parse
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          BASE=$(cat VERSION)
          MANIFEST_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ ! "$BASE" =~ ^[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a SemVer-compatible numeric base" >&2
            exit 1
          fi
          if [[ "$MANIFEST_VERSION" != "$BASE" ]]; then
            echo "Cargo.toml version must match VERSION" >&2
            exit 1
          fi
          if [[ "$RAW_TAG" == "dev" ]]; then
            # dev tag: use the repository VERSION base with a -dev suffix
            echo "version=${BASE}-dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${RAW_TAG#v}"
            PRERELEASE_IDENTIFIER='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
            BASE_PATTERN="${BASE//./\\.}"
            TAG_PATTERN="^${BASE_PATTERN}(-${PRERELEASE_IDENTIFIER}(\.${PRERELEASE_IDENTIFIER})*)?$"
            if [[ ! "$TAG" =~ $TAG_PATTERN ]]; then
              echo "release tag must match VERSION with an optional SemVer prerelease suffix" >&2
              exit 1
            fi
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: meta
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (musl — static linking, no glibc dependency)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: cs-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: cs-linux-arm64
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cs-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cs-darwin-arm64
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cs-windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: cs-windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "Building version: ${VERSION}"
          grep '^version' Cargo.toml

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/codex-switch"
          chmod +x "$BIN"
          tar czf "${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" codex-switch
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a "${{ matrix.name }}.zip" "./target/${{ matrix.target }}/release/codex-switch.exe"
          sha256sum "${{ matrix.name }}.zip" > "${{ matrix.name }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256
          if-no-files-found: ignore

  release:
    needs: [meta, build, legacy-upgrade]
    if: >-
      always() && needs.meta.result == 'success' && needs.build.result == 'success' &&
      (needs['legacy-upgrade'].result == 'success' || needs['legacy-upgrade'].result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Verify release checksums
        shell: bash
        run: |
          archives=(
            cs-linux-amd64.tar.gz
            cs-linux-arm64.tar.gz
            cs-darwin-amd64.tar.gz
            cs-darwin-arm64.tar.gz
            cs-windows-amd64.zip
            cs-windows-arm64.zip
          )
          for name in "${archives[@]}"; do
            archive="artifacts/${name}"
            checksum="${archive}.sha256"
            if [[ ! -s "$archive" || ! -s "$checksum" ]]; then
              echo "Missing or empty release archive/checksum: $archive / $checksum" >&2
              exit 1
            fi
            (
              cd artifacts
              sha256sum --check "$(basename "$checksum")"
            )
          done

      - name: Attest release archives
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip

      - name: Add provenance bundle to release assets
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" artifacts/codex-switch-build-provenance.json

      - name: Generate install script body
        run: |
          cat > artifacts/INSTALL.md << 'HEREDOC'
          ## Quick Install

          ### Stable: macOS / Linux

          ```bash
          curl -fsSL https://github.com/xjoker/codex-switch/releases/latest/download/install.sh | bash
          ```

          ### Stable: Windows PowerShell

          ```powershell
          irm https://github.com/xjoker/codex-switch/releases/latest/download/install.ps1 | iex
          ```

          ### Rolling dev: macOS / Linux

          ```bash
          curl -fsSL https://github.com/xjoker/codex-switch/releases/download/dev/install.sh | bash -s -- --dev
          ```

          ### Rolling dev: Windows PowerShell

          ```powershell
          $env:CS_DEV="1"; irm https://github.com/xjoker/codex-switch/releases/download/dev/install.ps1 | iex
          ```

          ### Manual Download

          Download the appropriate binary from the assets below and place it in your PATH.
          HEREDOC

      - name: Copy install scripts
        run: |
          cp scripts/install.sh artifacts/install.sh
          cp scripts/install.ps1 artifacts/install.ps1

      - name: Generate dev release body
        if: needs.meta.outputs.is_dev == 'true'
        id: dev_body
        run: |
          cat > dev_body.md << EOF
          Development build from \`${GITHUB_REF}\` at ${GITHUB_SHA}.

          **This is a pre-release build for testing.** Use \`codex-switch self-update --dev\` to install, or \`codex-switch self-update --stable\` to return to the latest stable release.

          **Older macOS/Linux direct install in \`/usr/local/bin\`:** migrate once with the matching user-level installer. It verifies the download, requests \`sudo\` once, installs to \`~/.local/bin\`, removes the old binary, and preserves profiles and configuration.

          \`curl -fsSL https://github.com/xjoker/codex-switch/releases/download/dev/install.sh | bash -s -- --dev\`

          Version: \`${RELEASE_VERSION}\`
          EOF

      - name: Create GitHub Release (dev)
        if: needs.meta.outputs.is_dev == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: "dev (${{ needs.meta.outputs.version }})"
          prerelease: true
          overwrite_files: true
          body_path: dev_body.md
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (stable)
        if: needs.meta.outputs.is_dev != 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          overwrite_files: true
          generate_release_notes: true
          body: |
            **Older macOS/Linux direct install in `/usr/local/bin`:** migrate once with the matching user-level installer. It verifies the download, requests `sudo` once, installs to `~/.local/bin`, removes the old binary, and preserves profiles and configuration.

            `curl -fsSL https://github.com/xjoker/codex-switch/releases/download/v${{ needs.meta.outputs.version }}/install.sh | bash`
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  legacy-upgrade:
    needs: [meta, build]
    if: needs.meta.outputs.is_dev == 'true' || needs.meta.outputs.prerelease == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
      IS_DEV: ${{ needs.meta.outputs.is_dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Upgrade v0.0.19 on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              asset="cs-linux-amd64.tar.gz"
              pinned_hash="3589fdac3d480aea83ab61dd4fb0a7592c018a44415842083df2d5f1d0bb0d2f"
              ;;
            Linux-aarch64|Linux-arm64)
              asset="cs-linux-arm64.tar.gz"
              pinned_hash="5db981cc5f1380f3bf9ac2d66484c0cc67d06712e617c2cd0457e3058dcb12b0"
              ;;
            Darwin-x86_64)
              asset="cs-darwin-amd64.tar.gz"
              pinned_hash="cbc4229285c5e8ea02c9463b7868cd03f2021f5125f5b187ff99e3bebe16e278"
              ;;
            Darwin-arm64)
              asset="cs-darwin-arm64.tar.gz"
              pinned_hash="2e365dc8273c04ee634d593eeada338a46ba7c7db2a1ca8f5c2aff30aec57a98"
              ;;
            *) echo "Unsupported legacy-upgrade runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          work="${RUNNER_TEMP}/codex-switch-legacy-upgrade"
          mkdir -p "$work/home"
          api_root="${work}/api"
          mkdir -p "$api_root/artifacts"
          cp artifacts/* "$api_root/artifacts/"
          if [[ "$IS_DEV" == "true" ]]; then
            api_path="repos/xjoker/codex-switch/releases/tags/dev"
            release_tag="dev"
            release_name="dev (${EXPECTED_VERSION})"
          else
            api_path="repos/xjoker/codex-switch/releases/latest"
            release_tag="v${EXPECTED_VERSION}"
            release_name="$release_tag"
          fi
          api_file="${api_root}/${api_path}"
          mkdir -p "$(dirname "$api_file")"
          python3 scripts/prepare-release-metadata.py \
            --artifacts-dir "$api_root/artifacts" \
            --output "$api_file" \
            --base-url "http://127.0.0.1:8765/artifacts" \
            --tag "$release_tag" \
            --name "$release_name"
          test -s "$api_file"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$api_root" >/dev/null 2>&1 &
          metadata_server_pid=$!
          trap 'kill "$metadata_server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS "http://127.0.0.1:8765/${api_path}" >/dev/null && break
            test "$attempt" -lt 5
            sleep 1
          done
          base="https://github.com/xjoker/codex-switch/releases/download/v0.0.19"
          curl -fsSL "${base}/${asset}" -o "${work}/${asset}"
          curl -fsSL "${base}/${asset}.sha256" -o "${work}/${asset}.sha256"
          (
            cd "$work"
            printf '%s  %s\n' "$pinned_hash" "$asset" | shasum -a 256 -c -
            shasum -a 256 -c "${asset}.sha256"
            tar xzf "$asset"
          )
          bin="${work}/codex-switch"
          test "$("$bin" --version | head -n 1)" = "codex-switch 0.0.19"
          if [[ "$IS_DEV" == "true" ]]; then
            HOME="${work}/home" CS_GITHUB_API_URL=http://127.0.0.1:8765 "$bin" self-update --dev
          else
            HOME="${work}/home" CS_GITHUB_API_URL=http://127.0.0.1:8765 "$bin" self-update --stable
          fi
          test "$("$bin" --version | head -n 1)" = "codex-switch ${EXPECTED_VERSION}"

      - name: Upgrade v0.0.19 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "codex-switch-legacy-upgrade"
          $apiRoot = Join-Path $work "api"
          $artifactRoot = Join-Path $apiRoot "artifacts"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          Copy-Item -Path "artifacts\*" -Destination $artifactRoot -Force
          if ($env:IS_DEV -eq "true") {
            $apiPath = "repos/xjoker/codex-switch/releases/tags/dev"
            $releaseTag = "dev"
            $releaseName = "dev ($env:EXPECTED_VERSION)"
          } else {
            $apiPath = "repos/xjoker/codex-switch/releases/latest"
            $releaseTag = "v$env:EXPECTED_VERSION"
            $releaseName = $releaseTag
          }
          $apiFile = Join-Path $apiRoot $apiPath
          New-Item -ItemType Directory -Path (Split-Path $apiFile) -Force | Out-Null
          & python scripts/prepare-release-metadata.py `
            --artifacts-dir $artifactRoot `
            --output $apiFile `
            --base-url "http://127.0.0.1:8765/artifacts" `
            --tag $releaseTag `
            --name $releaseName
          if ($LASTEXITCODE -ne 0) { throw "local release metadata generation failed" }
          if (-not (Test-Path -LiteralPath $apiFile)) { throw "local release metadata missing" }
          $metadataServer = Start-Process -FilePath python -ArgumentList @(
            "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $apiRoot
          ) -WindowStyle Hidden -PassThru
          try {
            $metadataReady = $false
            foreach ($attempt in 1..5) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:8765/$apiPath" -UseBasicParsing | Out-Null
                $metadataReady = $true
                break
              } catch {
                if ($attempt -eq 5) { throw }
                Start-Sleep -Seconds 1
              }
            }
            if (-not $metadataReady) { throw "local release metadata server did not start" }
            $asset = "cs-windows-amd64.zip"
            $base = "https://github.com/xjoker/codex-switch/releases/download/v0.0.19"
            $archive = Join-Path $work $asset
            $checksum = "${archive}.sha256"
            Invoke-WebRequest -Uri "$base/$asset" -OutFile $archive
            Invoke-WebRequest -Uri "$base/$asset.sha256" -OutFile $checksum
            $expectedHash = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
            $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) { throw "v0.0.19 checksum mismatch" }
            $pinnedHash = "9ff8a3f8794517771ef6959632417fdf1dfbc85b7fdf4c344998223985582e63"
            if ($actualHash -ne $pinnedHash) { throw "v0.0.19 archive changed from the reviewed fixture" }
            Expand-Archive -Path $archive -DestinationPath $work -Force
            $bin = Join-Path $work "codex-switch.exe"
            if (@(& $bin --version)[0] -ne "codex-switch 0.0.19") {
              throw "unexpected legacy version"
            }
            $env:CS_GITHUB_API_URL = "http://127.0.0.1:8765"
            if ($env:IS_DEV -eq "true") {
              & $bin self-update --dev
            } else {
              & $bin self-update --stable
            }
            if ($LASTEXITCODE -ne 0) { throw "v0.0.19 self-update failed" }
            if (@(& $bin --version)[0] -ne "codex-switch $env:EXPECTED_VERSION") {
              throw "legacy upgrade installed an unexpected version"
            }
          } finally {
            Stop-Process -Id $metadataServer.Id -Force -ErrorAction SilentlyContinue
          }

  homebrew:
    needs: [meta, release, legacy-upgrade]
    if: needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify Homebrew archive checksums
        id: sha
        run: |
          set -euo pipefail
          declare -A assets=(
            [darwin_arm64]=cs-darwin-arm64.tar.gz
            [darwin_amd64]=cs-darwin-amd64.tar.gz
            [linux_arm64]=cs-linux-arm64.tar.gz
            [linux_amd64]=cs-linux-amd64.tar.gz
          )
          for key in "${!assets[@]}"; do
            name="${assets[$key]}"
            archive="artifacts/${name}"
            checksum="${archive}.sha256"
            test -s "$archive"
            test -s "$checksum"
            expected=$(awk 'NF >= 1 { print $1; exit }' "$checksum")
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]
            recorded=$(awk 'NF >= 2 { print $NF; exit }' "$checksum")
            [[ "$recorded" == "$name" ]]
            actual=$(sha256sum "$archive" | awk '{print $1}')
            [[ "$actual" =~ ^[0-9a-fA-F]{64}$ ]]
            [[ "$actual" == "${expected,,}" ]]
            printf '%s=%s\n' "$key" "$actual" >> "$GITHUB_OUTPUT"
          done

      - name: Generate formula
        run: |
          VERSION="$RELEASE_VERSION"
          BASE="https://github.com/xjoker/codex-switch/releases/download/v${VERSION}"

          # Generate latest formula (codex-switch.rb)
          cat > codex-switch.rb << RUBY
          class CodexSwitch < Formula
            desc "Codex account switcher — multi-profile manager with usage dashboard"
            homepage "https://github.com/xjoker/codex-switch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/cs-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/cs-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install "codex-switch"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codex-switch --version")
            end
          end
          RUBY

          # Generate versioned formula (codex-switch@X.Y.Z.rb)
          # Homebrew requires unique class names: CodexSwitchATx_y_z
          CLASS_SUFFIX=$(echo "${VERSION}" | tr '.' '_')
          cat > "codex-switch@${VERSION}.rb" << RUBY
          class CodexSwitchAT${CLASS_SUFFIX} < Formula
            desc "Codex account switcher — multi-profile manager with usage dashboard"
            homepage "https://github.com/xjoker/codex-switch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/cs-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/cs-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            keg_only :versioned_formula

            def install
              bin.install "codex-switch"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codex-switch --version")
            end
          end
          RUBY

      - name: Push formula to tap
        run: |
          VERSION="$RELEASE_VERSION"
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/xjoker/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp codex-switch.rb tap/Formula/codex-switch.rb
          cp "codex-switch@${VERSION}.rb" "tap/Formula/codex-switch@${VERSION}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "codex-switch ${VERSION} (latest + versioned formula)"
          git push
