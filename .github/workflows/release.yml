name: Release

on:
  push:
    tags:
      - "v*"
      - "dev"

permissions:
  contents: read

# Never let two runs for the same tag race to overwrite release assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      is_dev: ${{ steps.parse.outputs.is_dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse tag
        id: parse
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          BASE=$(cat VERSION)
          MANIFEST_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ ! "$BASE" =~ ^[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a SemVer-compatible numeric base" >&2
            exit 1
          fi
          if [[ "$MANIFEST_VERSION" != "$BASE" ]]; then
            echo "Cargo.toml version must match VERSION" >&2
            exit 1
          fi
          if [[ "$RAW_TAG" == "dev" ]]; then
            # dev tag: use the repository VERSION base with a -dev suffix
            echo "version=${BASE}-dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${RAW_TAG#v}"
            PRERELEASE_IDENTIFIER='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
            BASE_PATTERN="${BASE//./\\.}"
            TAG_PATTERN="^${BASE_PATTERN}(-${PRERELEASE_IDENTIFIER}(\.${PRERELEASE_IDENTIFIER})*)?$"
            if [[ ! "$TAG" =~ $TAG_PATTERN ]]; then
              echo "release tag must match VERSION with an optional SemVer prerelease suffix" >&2
              exit 1
            fi
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: meta
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (musl — static linking, no glibc dependency)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: cs-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: cs-linux-arm64
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cs-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cs-darwin-arm64
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cs-windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: cs-windows-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "Building version: ${VERSION}"
          grep '^version' Cargo.toml

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/codex-switch"
          chmod +x "$BIN"
          # The binary embeds Apache-2.0 upstream Codex text, so ship the license
          # and notice files next to it. Installers pick the binary by name and
          # ignore the rest.
          STAGE="package-${{ matrix.name }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/THIRD-PARTY-LICENSES/upstream-codex"
          cp "$BIN" "$STAGE/codex-switch"
          cp LICENSE "$STAGE/LICENSE"
          cp assets/upstream-codex/LICENSE "$STAGE/THIRD-PARTY-LICENSES/upstream-codex/LICENSE"
          cp assets/upstream-codex/NOTICE.md "$STAGE/THIRD-PARTY-LICENSES/upstream-codex/NOTICE.md"
          tar czf "${{ matrix.name }}.tar.gz" -C "$STAGE" codex-switch LICENSE THIRD-PARTY-LICENSES
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Ship the license and notice files next to the binary (see the Unix
          # step); install.ps1 takes codex-switch.exe from the archive root.
          STAGE="package-${{ matrix.name }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/THIRD-PARTY-LICENSES/upstream-codex"
          cp "target/${{ matrix.target }}/release/codex-switch.exe" "$STAGE/codex-switch.exe"
          cp LICENSE "$STAGE/LICENSE"
          cp assets/upstream-codex/LICENSE "$STAGE/THIRD-PARTY-LICENSES/upstream-codex/LICENSE"
          cp assets/upstream-codex/NOTICE.md "$STAGE/THIRD-PARTY-LICENSES/upstream-codex/NOTICE.md"
          (cd "$STAGE" && 7z a "../${{ matrix.name }}.zip" codex-switch.exe LICENSE THIRD-PARTY-LICENSES)
          sha256sum "${{ matrix.name }}.zip" > "${{ matrix.name }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256
          if-no-files-found: ignore

  attest:
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release checksums
        shell: bash
        run: |
          archives=(
            cs-linux-amd64.tar.gz
            cs-linux-arm64.tar.gz
            cs-darwin-amd64.tar.gz
            cs-darwin-arm64.tar.gz
            cs-windows-amd64.zip
            cs-windows-arm64.zip
          )
          for name in "${archives[@]}"; do
            archive="artifacts/${name}"
            checksum="${archive}.sha256"
            if [[ ! -s "$archive" || ! -s "$checksum" ]]; then
              echo "Missing or empty release archive/checksum: $archive / $checksum" >&2
              exit 1
            fi
            (
              cd artifacts
              sha256sum --check "$(basename "$checksum")"
            )
          done

      # Attest before the upgrade gate: updaters since v20260804.1.0 verify
      # this provenance, so the gate can only exercise them with a bundle.
      - name: Attest release archives
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip

      - name: Stage provenance bundle
        shell: bash
        run: |
          mkdir -p provenance
          cp "${{ steps.attest.outputs.bundle-path }}" provenance/codex-switch-build-provenance.json

      - name: Upload provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provenance
          path: provenance/codex-switch-build-provenance.json
          if-no-files-found: error

  release:
    needs: [meta, build, attest, legacy-upgrade]
    if: >-
      always() && needs.meta.result == 'success' && needs.build.result == 'success' &&
      needs.attest.result == 'success' &&
      (needs['legacy-upgrade'].result == 'success' || needs['legacy-upgrade'].result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Verify release checksums and provenance bundle
        shell: bash
        run: |
          test -s artifacts/codex-switch-build-provenance.json
          for checksum in artifacts/*.sha256; do
            (
              cd artifacts
              sha256sum --check "$(basename "$checksum")"
            )
          done

      - name: Generate install script body
        run: |
          cat > artifacts/INSTALL.md << 'HEREDOC'
          ## Quick Install

          ### Stable: macOS / Linux

          ```bash
          curl -fsSL https://github.com/xjoker/codex-switch/releases/latest/download/install.sh | bash
          ```

          ### Stable: Windows PowerShell

          ```powershell
          irm https://github.com/xjoker/codex-switch/releases/latest/download/install.ps1 | iex
          ```

          ### Rolling dev: macOS / Linux

          ```bash
          curl -fsSL https://github.com/xjoker/codex-switch/releases/download/dev/install.sh | bash -s -- --dev
          ```

          ### Rolling dev: Windows PowerShell

          ```powershell
          $env:CS_DEV="1"; irm https://github.com/xjoker/codex-switch/releases/download/dev/install.ps1 | iex
          ```

          ### Manual Download

          Download the appropriate binary from the assets below and place it in your PATH.
          HEREDOC

      - name: Copy install scripts
        run: |
          cp scripts/install.sh artifacts/install.sh
          cp scripts/install.ps1 artifacts/install.ps1

      - name: Generate dev release body
        if: needs.meta.outputs.is_dev == 'true'
        id: dev_body
        run: |
          cat > dev_body.md << EOF
          Development build from \`${GITHUB_REF}\` at ${GITHUB_SHA}.

          **This is a pre-release build for testing.** Use \`codex-switch self-update --dev\` to install, or \`codex-switch self-update --stable\` to return to the latest stable release.

          **Older macOS/Linux direct install in \`/usr/local/bin\`:** migrate once with the matching user-level installer. It verifies the download, requests \`sudo\` once, installs to \`~/.local/bin\`, removes the old binary, and preserves profiles and configuration.

          \`curl -fsSL https://github.com/xjoker/codex-switch/releases/download/dev/install.sh | bash -s -- --dev\`

          Version: \`${RELEASE_VERSION}\`
          EOF

      - name: Create GitHub Release (dev)
        if: needs.meta.outputs.is_dev == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: "dev (${{ needs.meta.outputs.version }})"
          prerelease: true
          overwrite_files: true
          body_path: dev_body.md
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (stable)
        if: needs.meta.outputs.is_dev != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          overwrite_files: true
          generate_release_notes: true
          body: |
            **Older macOS/Linux direct install in `/usr/local/bin`:** migrate once with the matching user-level installer. It verifies the download, requests `sudo` once, installs to `~/.local/bin`, removes the old binary, and preserves profiles and configuration.

            `curl -fsSL https://github.com/xjoker/codex-switch/releases/download/v${{ needs.meta.outputs.version }}/install.sh | bash`
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  legacy-upgrade:
    needs: [meta, build, attest]
    if: needs.meta.outputs.is_dev == 'true' || needs.meta.outputs.prerelease == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
        # 0.0.19: oldest supported updater. 20260804.1.0: last stable with the
        # removed daemon; its updater verifies provenance and restarts the
        # daemon with the new binary.
        legacy: ["0.0.19", "20260804.1.0"]
    name: legacy-upgrade (${{ matrix.os }}, v${{ matrix.legacy }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
      IS_DEV: ${{ needs.meta.outputs.is_dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Upgrade v${{ matrix.legacy }} on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/legacy-upgrade.sh "${{ matrix.legacy }}"

      - name: Upgrade v${{ matrix.legacy }} on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/legacy-upgrade.ps1 -Legacy "${{ matrix.legacy }}"

  homebrew:
    needs: [meta, release]
    if: needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify Homebrew archive checksums
        id: sha
        run: |
          set -euo pipefail
          declare -A assets=(
            [darwin_arm64]=cs-darwin-arm64.tar.gz
            [darwin_amd64]=cs-darwin-amd64.tar.gz
            [linux_arm64]=cs-linux-arm64.tar.gz
            [linux_amd64]=cs-linux-amd64.tar.gz
          )
          for key in "${!assets[@]}"; do
            name="${assets[$key]}"
            archive="artifacts/${name}"
            checksum="${archive}.sha256"
            test -s "$archive"
            test -s "$checksum"
            expected=$(awk 'NF >= 1 { print $1; exit }' "$checksum")
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]
            recorded=$(awk 'NF >= 2 { print $NF; exit }' "$checksum")
            [[ "$recorded" == "$name" ]]
            actual=$(sha256sum "$archive" | awk '{print $1}')
            [[ "$actual" =~ ^[0-9a-fA-F]{64}$ ]]
            [[ "$actual" == "${expected,,}" ]]
            printf '%s=%s\n' "$key" "$actual" >> "$GITHUB_OUTPUT"
          done

      - name: Generate formula
        run: |
          VERSION="$RELEASE_VERSION"
          BASE="https://github.com/xjoker/codex-switch/releases/download/v${VERSION}"

          # Generate latest formula (codex-switch.rb)
          cat > codex-switch.rb << RUBY
          class CodexSwitch < Formula
            desc "Codex account switcher — multi-profile manager with usage dashboard"
            homepage "https://github.com/xjoker/codex-switch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/cs-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/cs-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install "codex-switch"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codex-switch --version")
            end
          end
          RUBY

          # Generate versioned formula (codex-switch@X.Y.Z.rb)
          # Homebrew requires unique class names: CodexSwitchATx_y_z
          CLASS_SUFFIX=$(echo "${VERSION}" | tr '.' '_')
          cat > "codex-switch@${VERSION}.rb" << RUBY
          class CodexSwitchAT${CLASS_SUFFIX} < Formula
            desc "Codex account switcher — multi-profile manager with usage dashboard"
            homepage "https://github.com/xjoker/codex-switch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/cs-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/cs-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            keg_only :versioned_formula

            def install
              bin.install "codex-switch"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codex-switch --version")
            end
          end
          RUBY

      - name: Push formula to tap
        run: |
          VERSION="$RELEASE_VERSION"
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/xjoker/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp codex-switch.rb tap/Formula/codex-switch.rb
          cp "codex-switch@${VERSION}.rb" "tap/Formula/codex-switch@${VERSION}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}."
            exit 0
          fi
          git commit -m "codex-switch ${VERSION} (latest + versioned formula)"
          git push
